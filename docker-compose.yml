services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: macrofast
      POSTGRES_USER: macrofast
      POSTGRES_PASSWORD: macrofast
    ports:
      - "5432:5432"
    volumes:
      - macrofast-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macrofast"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  macrofast-postgres:
